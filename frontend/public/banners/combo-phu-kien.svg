<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 615" width="1600" height="615" role="img" aria-label="Combo phu kien tiet kiem them 15 phan tram">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.5" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="615" fill="url(#bg3)"/>
  <circle cx="1260" cy="480" r="300" fill="#0d9488" opacity="0.35"/>
  <circle cx="1350" cy="130" r="180" fill="#5eead4" opacity="0.18"/>

  <g font-family="'Space Grotesk','IBM Plex Sans',Segoe UI,sans-serif">
    <rect x="230" y="118" width="246" height="42" rx="21" fill="#ffffff" opacity="0.16"/>
    <text x="254" y="146" fill="#ccfbf1" font-size="20" font-weight="600" letter-spacing="2.4">COMBO PHỤ KIỆN</text>

    <text x="230" y="248" fill="#ffffff" font-size="70" font-weight="700">Mua tai nghe + sạc</text>
    <text x="230" y="334" fill="url(#accent3)" font-size="70" font-weight="700">tiết kiệm thêm 15%</text>
    <text x="230" y="392" fill="#bff1e8" font-size="26" font-weight="400">Tai nghe · Sạc nhanh · Pin dự phòng · Ốp lưng chính hãng</text>

    <rect x="230" y="434" width="242" height="62" rx="31" fill="#ffffff"/>
    <text x="351" y="474" fill="#0f766e" font-size="24" font-weight="700" text-anchor="middle">Xem phụ kiện</text>

    <text x="504" y="474" fill="#a7e5da" font-size="21" font-weight="400">Đổi trả trong 30 ngày</text>
  </g>

  <g transform="translate(1050 150)">
    <!-- Cu sac -->
    <rect x="0" y="146" width="146" height="146" rx="30" fill="#f8fafc"/>
    <rect x="50" y="118" width="18" height="32" rx="6" fill="#cbd5e1"/>
    <rect x="82" y="118" width="18" height="32" rx="6" fill="#cbd5e1"/>
    <rect x="32" y="204" width="82" height="12" rx="6" fill="#0f766e" opacity="0.35"/>
    <!-- Hop tai nghe -->
    <g transform="translate(190 88)">
      <rect x="0" y="56" width="170" height="146" rx="34" fill="#f8fafc"/>
      <circle cx="58" cy="129" r="29" fill="#14b8a6" opacity="0.28"/>
      <circle cx="112" cy="129" r="29" fill="#14b8a6" opacity="0.28"/>
      <circle cx="58" cy="129" r="12" fill="#0f172a" opacity="0.55"/>
      <circle cx="112" cy="129" r="12" fill="#0f172a" opacity="0.55"/>
      <rect x="56" y="26" width="58" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
    </g>
  </g>
</svg>
