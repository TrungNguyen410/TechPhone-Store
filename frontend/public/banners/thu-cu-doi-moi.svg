<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 615" width="1600" height="615" role="img" aria-label="Thu cu doi moi - tro gia den 4 trieu">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#152a5e"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="615" fill="url(#bg1)"/>
  <circle cx="1290" cy="120" r="330" fill="#3b82f6" opacity="0.16"/>
  <circle cx="1130" cy="520" r="230" fill="#7c3aed" opacity="0.18"/>

  <!-- Vung an toan: chu nam trong x 230..1400. Anh hero duoc `object-fit: cover`
       nen o mot so ti le khung hai mep bi cat, dat sat le se mat chu. -->
  <g font-family="'Space Grotesk','IBM Plex Sans',Segoe UI,sans-serif">
    <rect x="230" y="118" width="266" height="42" rx="21" fill="#ffffff" opacity="0.14"/>
    <text x="254" y="146" fill="#e0f2fe" font-size="20" font-weight="600" letter-spacing="2.4">CHƯƠNG TRÌNH THU CŨ</text>

    <text x="230" y="248" fill="#ffffff" font-size="72" font-weight="700">Thu cũ đổi mới</text>
    <text x="230" y="336" fill="url(#accent1)" font-size="66" font-weight="700">Trợ giá đến 4.000.000₫</text>
    <text x="230" y="394" fill="#c7d7f5" font-size="26" font-weight="400">Định giá máy cũ tại chỗ · Trừ thẳng vào giá máy mới</text>

    <rect x="230" y="436" width="238" height="62" rx="31" fill="#ffffff"/>
    <text x="349" y="476" fill="#12224a" font-size="24" font-weight="700" text-anchor="middle">Khám phá ngay</text>

    <text x="500" y="476" fill="#9fb8e6" font-size="21" font-weight="400">Trả góp 0% qua thẻ tín dụng</text>
  </g>

  <g transform="translate(1088 100)">
    <rect x="84" y="32" width="192" height="384" rx="34" fill="#0b1220" opacity="0.45"/>
    <rect x="0" y="0" width="226" height="422" rx="40" fill="#f8fafc"/>
    <rect x="12" y="12" width="202" height="398" rx="30" fill="url(#screen1)"/>
    <rect x="86" y="26" width="54" height="11" rx="5.5" fill="#0f172a" opacity="0.55"/>
    <g fill="#ffffff" opacity="0.92">
      <rect x="40" y="122" width="146" height="15" rx="7.5"/>
      <rect x="40" y="160" width="106" height="15" rx="7.5" opacity="0.75"/>
      <rect x="40" y="222" width="146" height="56" rx="16" opacity="0.28"/>
      <rect x="40" y="298" width="146" height="56" rx="16" opacity="0.28"/>
    </g>
  </g>
</svg>
