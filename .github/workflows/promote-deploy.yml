name: Promote devnguyen to deploy

# Chay sau khi push len devnguyen: kiem tra lai toan bo, xanh het thi
# fast-forward nhanh deploy-netlify-vercel -> Netlify tu build lai.
on:
  push:
    branches:
      - devnguyen
  workflow_dispatch:

concurrency:
  group: promote-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify before promoting
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run API tests
        working-directory: backend
        run: npm run test:coverage

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  promote:
    name: Fast-forward deploy branch
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Chi fast-forward. Neu nhanh deploy co commit rieng chua co tren
      # devnguyen thi buoc nay fail — co y, de khong am tham ghi de.
      - name: Fast-forward deploy-netlify-vercel
        run: |
          set -euo pipefail
          git fetch origin devnguyen deploy-netlify-vercel
          if git merge-base --is-ancestor origin/deploy-netlify-vercel origin/devnguyen; then
            git push origin "origin/devnguyen:refs/heads/deploy-netlify-vercel"
            echo "Da fast-forward deploy-netlify-vercel len $(git rev-parse --short origin/devnguyen)"
          else
            echo "::error::deploy-netlify-vercel co commit chua co tren devnguyen."
            echo "::error::Merge deploy-netlify-vercel vao devnguyen truoc roi chay lai."
            git --no-pager log --oneline origin/devnguyen..origin/deploy-netlify-vercel
            exit 1
          fi
