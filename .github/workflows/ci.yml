name: Continuous Integration

on:
  push:
    branches:
      - main
      - deploy-netlify-vercel
      - devnguyen
      - devdhuy
      - devthuy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:coverage

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.techphone.example/api
      VITE_USE_MOCK: "false"
      VITE_SITE_URL: https://shop.techphone.example
      VITE_DEPLOYMENT_TARGET: render
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-docker-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-docker-refresh-secret-at-least-32-characters
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build

  # Push len devnguyen ma ba job tren xanh het thi day thang len nhanh
  # deploy-netlify-vercel de Netlify/Vercel tu build lai.
  promote:
    name: Promote to deploy branch
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/devnguyen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Chi fast-forward. Neu nhanh deploy co commit rieng chua co tren
      # devnguyen thi buoc nay fail — co y, de khong am tham ghi de.
      - name: Fast-forward deploy-netlify-vercel
        run: |
          set -euo pipefail
          git fetch --no-tags origin devnguyen deploy-netlify-vercel
          if git merge-base --is-ancestor origin/deploy-netlify-vercel origin/devnguyen; then
            git push origin "${{ github.sha }}:refs/heads/deploy-netlify-vercel"
            echo "Da fast-forward deploy-netlify-vercel len ${{ github.sha }}"
          else
            echo "::error::deploy-netlify-vercel co commit chua co tren devnguyen."
            echo "::error::Merge deploy-netlify-vercel vao devnguyen truoc roi chay lai."
            git --no-pager log --oneline origin/devnguyen..origin/deploy-netlify-vercel
            exit 1
          fi
